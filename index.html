<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Chrome на Android в режиме «Версия для ПК» не читает строку viewport выше и рисует страницу
    // шириной 980px, поэтому на телефоне всё становится в 2–2,5 раза мельче. Тогда увеличиваем страницу
    // обратно до ширины экрана. На iPhone, компьютере и в обычном режиме Android ничего не меняется.
    (function () {
      var de = document.documentElement;
      function fit() {
        var w = de.clientWidth, h = de.clientHeight;
        var shortSide = Math.min(screen.width, screen.height), longSide = Math.max(screen.width, screen.height);
        var z = Math.round(w / (w > h ? longSide : shortSide) * 100) / 100;
        if (z > 1.15 && matchMedia('(pointer: coarse)').matches) {
          de.style.zoom = z;
          de.style.setProperty('--app-h', 'calc(100dvh / ' + z + ')');
        } else {
          de.style.removeProperty('zoom');
          de.style.removeProperty('--app-h');
        }
      }
      fit();
      addEventListener('resize', fit);
    })();
  </script>
  <meta name="theme-color" content="#62C4FF">
  <meta name="description" content="Немецкий с нуля до A2 по программе Goethe-Zertifikat: уроки по 5 минут, игры, интервальное повторение.">

  <style>
    /* Заставка при запуске: видна сразу, пока грузятся уроки. Убирает её js/main.js. */
    #splash { position: fixed; inset: 0; z-index: 1000; overflow: hidden; color: #fff; text-align: center;
      font-family: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.26) 0, rgba(255,255,255,0) 46vmin), linear-gradient(#62C4FF, #2184E0);
      transition: opacity .4s ease, transform .4s ease; }
    #splash.is-out { opacity: 0; transform: scale(1.06); pointer-events: none; }
    #splash img { position: absolute; left: 50%; top: 44%; width: 200px; height: 200px; margin: -100px 0 0 -100px;
      animation: splash-bob 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
    .splash__txt { position: absolute; left: 0; right: 0; top: calc(44% + 108px); animation: splash-up .5s .15s ease both; }
    .splash__name { font-weight: 900; font-size: 44px; line-height: 1.1; letter-spacing: .5px; text-shadow: 0 3px 0 rgba(13, 79, 148, .35); }
    .splash__sub { margin-top: 4px; font-weight: 800; font-size: 17px; opacity: .92; }
    .splash__dots { margin-top: 26px; display: flex; justify-content: center; gap: 9px; }
    .splash__dots i { width: 11px; height: 11px; border-radius: 50%; background: #fff; animation: splash-dot 1s ease-in-out infinite; }
    .splash__dots i:nth-child(2) { animation-delay: .15s; }
    .splash__dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes splash-bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
    @keyframes splash-up { from { opacity: 0; transform: translateY(14px); } }
    @keyframes splash-dot { 0%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash img, .splash__dots i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="img/splash.webp" alt="" width="200" height="200">
    <div class="splash__txt">
      <div class="splash__name">Брецель</div>
      <div class="splash__sub">Немецкий с нуля</div>
      <div class="splash__dots"><i></i><i></i><i></i></div>
    </div>
  </div>
  <script>
    // Страховка: если приложение не запустилось за 10 секунд, заставка уходит сама и видно сообщение об ошибке.
    setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 10000);
  </script>
  <div id="app" class="app"></div>
  <noscript>Для работы курса нужен JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
